# Shared across hosts. Per-machine overrides (including [bootstrap.*]) go in the
# untracked ~/.config/mise/config.local.toml, which mise loads after this file.

[tools]
"github:jiskanulo/kairan" = "latest"
go = "latest"
node = "latest"
"pipx:rich-cli" = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = "stable"
uv = "latest"

[settings]
# Own tool: skip the minimum_release_age wait for its releases.
minimum_release_age_excludes = ["github:jiskanulo/kairan"]

# Paths follow the ghq layout (ghq root = ~/Workspace) so `ghq list` sees them.
# No `ref`: `apply` only clones missing ones; `mise bootstrap repos update`
# fast-forwards. agents_castle is private, so git must be able to authenticate
# to GitHub over HTTPS first (e.g. `gh auth login && gh auth setup-git`).
[bootstrap.repos]
"~/Workspace/github.com/jiskanulo/dotfiles_castle" = { url = "https://github.com/jiskanulo/dotfiles_castle" }
"~/Workspace/github.com/jiskanulo/agents_castle" = { url = "https://github.com/jiskanulo/agents_castle" }
"~/Workspace/github.com/jiskanulo/brewfile" = { url = "https://github.com/jiskanulo/brewfile" }

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 48
magnification = false
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true
