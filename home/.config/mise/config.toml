[tools]
"github:jiskanulo/kairan" = "latest"
go = "latest"
node = "latest"
"pipx:rich-cli" = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = "stable"
uv = "latest"

[settings]
# Own tool: skip the minimum_release_age wait for its releases.
minimum_release_age_excludes = ["github:jiskanulo/kairan"]

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 48
magnification = false
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true
