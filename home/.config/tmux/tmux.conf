# general window-option
## name windows after the basename of the pane's cwd
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g mode-keys vi
setw -g pane-base-index 1
setw -g window-status-current-style fg="colour21",bg="colour15"

# general option
## prefix
set -g prefix C-t
## press C-t twice to send C-t to the application (fzf file widget etc.)
unbind C-b
bind C-t send-prefix

set -g allow-rename off
set -g focus-events on
set -g base-index 1
set -g history-limit 20000
set -g mouse on
set -g pane-active-border-style fg="colour27"
set -g pane-border-style        fg="colour16"
set -g renumber-windows on
set -g status-fg colour251
set -g status-bg colour17

## enable 256Color
## tmux-256color (unlike screen-256color) advertises italics
## terminal-overrides specifies the TERM outside tmux; xterm-256color is used there
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

# Claude Code status icons
## ~/.claude/hooks/tmux-status.sh sets the pane option @claude_status
## (▶ working / ⏳ waiting for input / ✅ done) on hook events.
## Window list shows the icons of every pane in the window.
setw -g window-status-format '#I:#W#{?window_flags,#{window_flags}, }#{P:#{?#{@claude_status},#{@claude_status},}}'
setw -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}, }#{P:#{?#{@claude_status},#{@claude_status},}}'
## Per-pane status shown in the border, only while the window is split.
set -g pane-border-format ' #{?pane_active,#[reverse],}#{pane_index}#[default] #{?#{@claude_status},#{@claude_status} ,}#{pane_current_command} '
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

# key bindings
unbind s
unbind v

bind b previous-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind -r h resize-pane -L 4
bind -r j resize-pane -D 4
bind -r k resize-pane -U 4
bind -r l resize-pane -R 4

## Mac OS X Pasteboard Access (native since macOS 10.13 / tmux 2.6)
bind y run "tmux save-buffer - | pbcopy"
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

## reload tmux
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

## Popup window
bind g display-popup -xC -yC -w80% -h80% -d '#{pane_current_path}'
