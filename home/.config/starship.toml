"$schema" = 'https://starship.rs/config-schema.json'

# Default 500ms is too short for git status in large or cold-cache repos
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "blue"
truncation_length = 100
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
# Text labels with counts instead of pure's single "*" marker
format = "([$conflicted$staged$modified$renamed$deleted$untracked]($style))([$ahead_behind$stashed](cyan))"
style = "218"
conflicted = "conflicted:${count} "
staged = "staged:${count} "
modified = "modified:${count} "
renamed = "renamed:${count} "
deleted = "deleted:${count} "
untracked = "untracked:${count} "
ahead = "ahead:${count} "
behind = "behind:${count} "
diverged = "ahead:${ahead_count} behind:${behind_count} "
stashed = "stashed:${count} "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
